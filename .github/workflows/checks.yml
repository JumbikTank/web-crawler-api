name: Checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check crawler tests
      - run: uv run --frozen black --check crawler tests
      - run: uv run --frozen isort --check-only crawler tests
      - run: uv run --frozen mypy crawler tests
